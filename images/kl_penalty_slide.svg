<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Title -->
  <text x="400" y="45" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">
    MÔ HÌNH THAM CHIẾU (REFERENCE MODEL) &amp; PHẠT KL DIVERGENCE
  </text>
  <text x="400" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Cơ chế giữ neo bảo vệ sự tự nhiên của ngôn ngữ trong quá trình học RLHF
  </text>

  <!-- Group: Active Policy Model (Top) -->
  <g transform="translate(180, 140)">
    <!-- Box -->
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" />
    <!-- Icon: Active Robot Brain -->
    <g transform="translate(-80, 0)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#0284c7" />
      <circle cx="-8" cy="-5" r="3" fill="#ffffff" />
      <circle cx="8" cy="-5" r="3" fill="#ffffff" />
      <path d="M -10 10 Q 0 16 10 10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <path d="M 0 -20 L 0 -26" stroke="#0284c7" stroke-width="2" />
      <circle cx="0" cy="-28" r="3" fill="#ef4444" />
    </g>
    <!-- Text labels -->
    <text x="-40" y="-12" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="bold" fill="#0369a1">Active Policy Model</text>
    <text x="-40" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#0284c7">Chính sách &pi;&lt;tspan font-size="9" dy="-4"&gt;&theta;&lt;/tspan&gt;&lt;tspan font-size="12" dy="4"&gt;(y|x)&lt;/tspan&gt;</text>
    <text x="-40" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">Liên tục cập nhật tham số</text>
  </g>

  <!-- Group: Frozen Reference Model (Bottom) -->
  <g transform="translate(180, 320)">
    <!-- Box -->
    <rect x="-120" y="-45" width="240" height="90" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Icon: Frozen Robot with Lock -->
    <g transform="translate(-80, 0)">
      <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#64748b" />
      <circle cx="-8" cy="-5" r="3" fill="#cbd5e1" />
      <circle cx="8" cy="-5" r="3" fill="#cbd5e1" />
      <path d="M -8 10 Q 0 6 8 10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
      <!-- Padlock overlay -->
      <rect x="6" y="6" width="12" height="12" rx="2" fill="#ef4444" />
      <path d="M 8 6 L 8 3 Q 12 0 12 3 L 12 6" fill="none" stroke="#ef4444" stroke-width="1.5" />
    </g>
    <!-- Text labels -->
    <text x="-40" y="-12" font-family="'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="bold" fill="#334155">Reference Model</text>
    <text x="-40" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#64748b">Mô hình gốc &pi;&lt;tspan font-size="9" dy="-4"&gt;ref&lt;/tspan&gt;&lt;tspan font-size="12" dy="4"&gt;(y|x)&lt;/tspan&gt;</text>
    <text x="-40" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#f43f5e" font-weight="bold">BỊ KHÓA (FROZEN)</text>
  </g>

  <!-- Spring/Connector between Models -->
  <g transform="translate(180, 185)">
    <!-- Vertical dotted line representing comparison -->
    <line x1="0" y1="0" x2="0" y2="90" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4" />
    
    <!-- Measuring tape icon -->
    <g transform="translate(-15, 45)">
      <rect x="-15" y="-12" width="30" height="24" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
      <line x1="-10" y1="-6" x2="-10" y2="6" stroke="#d97706" stroke-width="1.5" />
      <line x1="-5" y1="-6" x2="-5" y2="2" stroke="#d97706" stroke-width="1" />
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#d97706" stroke-width="1.5" />
      <line x1="5" y1="-6" x2="5" y2="2" stroke="#d97706" stroke-width="1" />
      <line x1="10" y1="-6" x2="10" y2="6" stroke="#d97706" stroke-width="1.5" />
    </g>
  </g>

  <!-- The Anchor/Rubber Band Visual explanation (Right Side) -->
  <g transform="translate(540, 230)">
    <!-- Large Warning / Anchor Shield -->
    <rect x="-200" y="-120" width="380" height="240" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
    
    <!-- Title -->
    <text x="-180" y="-90" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#b45309">
      Vai Trò Neo Giữ Của Hàm Phạt KL:
    </text>
    
    <!-- Sigmoid formula / Loss formula -->
    <rect x="-180" y="-70" width="340" height="42" rx="6" fill="#fef3c7" />
    <text x="-10" y="-44" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#78350f" text-anchor="middle">
      Loss += &amp;beta; &amp;times; D&lt;tspan dy="3" font-size="10"&gt;KL&lt;/tspan&gt;(&amp;pi;&lt;tspan dy="-3" font-size="10"&gt;&theta;&lt;/tspan&gt; || &amp;pi;&lt;tspan dy="0" font-size="10"&gt;ref&lt;/tspan&gt;)
    </text>
    
    <!-- Bullet points -->
    <!-- Bullet 1 -->
    <circle cx="-170" cy="5" r="4.5" fill="#f59e0b" />
    <text x="-155" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#451a03" font-weight="bold">
      Ngăn ngừa sự lệch phân phối (Distribution Shift)
    </text>
    <text x="-155" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#78350f">
      Khiến mô hình không sinh câu trả lời OOD kỳ dị.
    </text>
    
    <!-- Bullet 2 -->
    <circle cx="-170" cy="55" r="4.5" fill="#f59e0b" />
    <text x="-155" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#451a03" font-weight="bold">
      Giữ vững khả năng ngôn ngữ tự nhiên
    </text>
    <text x="-155" y="77" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#78350f">
      Mô hình không bị 'quên' cách giao tiếp thông thường.
    </text>
    
    <!-- Anchor graphic overlay -->
    <g transform="translate(145, 75) scale(0.7)">
      <circle cx="0" cy="-30" r="10" fill="none" stroke="#d97706" stroke-width="4" />
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#d97706" stroke-width="4" />
      <line x1="-20" y1="-5" x2="20" y2="-5" stroke="#d97706" stroke-width="4" />
      <path d="M -30 10 C -30 30 30 30 30 10" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
      <path d="M -35 8 L -30 15 L -25 8 Z M 35 8 L 30 15 L 25 8 Z" fill="#d97706" />
    </g>
  </g>
  
  <!-- Flow lines connecting the systems -->
  <path d="M 300 230 Q 340 230 340 230" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4" marker-end="url(#arrow-orange)" />
  
  <!-- Defs for arrow marker -->
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>
</svg>
